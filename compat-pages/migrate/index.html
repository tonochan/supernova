<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#141a33">
<title>SUPERNOVA data transfer</title>
<style>
html,body{margin:0;min-height:100%;background:#101524;color:#f7f8ff;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{display:grid;place-items:center}
main{width:min(420px,calc(100% - 40px));text-align:center}
h1{font-size:28px;margin:0 0 14px}
p{color:#cfd6e8;line-height:1.6;margin:0 0 18px}
button{border:0;border-radius:8px;background:#246bfe;color:#fff;font-weight:800;padding:12px 18px}
.muted{font-size:13px;color:#9ea9c8}
.error{color:#ffb2a0;font-weight:700}
</style>
</head>
<body>
<main>
<h1 id="title">SUPERNOVA data transfer</h1>
<p id="status">Preparing saved data...</p>
<button id="retry" type="button">Try again</button>
<p class="muted" id="note">This page only reads SUPERNOVA data saved in this browser on the old GitHub Pages address.</p>
</main>
<script>
(function () {
  "use strict";

  var KIND = "supernova-local-data-migration";
  var ACK_KIND = "supernova-local-data-migration-ack";
  var SCHEMA_VERSION = 1;
  var DEFAULT_TARGET_ORIGIN = "https://supernova.tonochan.jp";
  var MAX_CHARS = 5000000;
  var ALLOWED_KEYS = [
    "supernova-best",
    "supernova-found",
    "supernova-game-state",
    "supernova-last-replay",
    "supernova-replay-history",
    "supernova-lang"
  ];

  var statusEl = document.getElementById("status");
  var retryEl = document.getElementById("retry");
  var titleEl = document.getElementById("title");
  var noteEl = document.getElementById("note");
  var targetOrigin = resolveTargetOrigin();
  var bridgeLang = resolveLang();
  var STR = {
    en: {
      title: "SUPERNOVA data transfer",
      preparing: "Preparing saved data...",
      retry: "Try again",
      close: "Close",
      note: "This page only reads SUPERNOVA data saved in this browser on the old GitHub Pages address.",
      openFromNewSite: "Open this window from the new SUPERNOVA site to transfer saved data.",
      sending: "Sending saved data...",
      noData: "No old saved data was found.",
      done: "Done. You can return to SUPERNOVA.",
      failed: "The new SUPERNOVA site could not import this data."
    },
    ja: {
      title: "SUPERNOVA データ移行",
      preparing: "保存データを確認しています...",
      retry: "もう一度試す",
      close: "閉じる",
      note: "このページは、旧GitHub Pages版でこのブラウザに保存されたSUPERNOVAデータだけを読み取ります。",
      openFromNewSite: "新しいSUPERNOVAサイトからこのウィンドウを開くと、保存データを移行できます。",
      sending: "保存データを送っています...",
      noData: "移行できる旧データは見つかりませんでした。",
      done: "移行が完了しました。SUPERNOVAに戻れます。",
      failed: "新しいSUPERNOVAサイトでこのデータを取り込めませんでした。"
    }
  };
  var text = STR[bridgeLang];
  var finished = false;
  var attempts = 0;

  applyLang();

  function resolveTargetOrigin() {
    var fallback = DEFAULT_TARGET_ORIGIN;
    var params = new URLSearchParams(window.location.search);
    var requested = params.get("targetOrigin");
    if (!requested || !isLocalHost(window.location.hostname)) return fallback;
    try {
      var url = new URL(requested);
      if ((url.hostname === "127.0.0.1" || url.hostname === "localhost") && /^https?:$/.test(url.protocol)) {
        return url.origin;
      }
    } catch (_) {
      return fallback;
    }
    return fallback;
  }

  function isLocalHost(hostname) {
    return hostname === "127.0.0.1" || hostname === "localhost";
  }

  function validLang(value) {
    return value === "ja" || value === "en" ? value : "";
  }

  function resolveLang() {
    var params = new URLSearchParams(window.location.search);
    var requested = validLang(params.get("lang"));
    if (requested) return requested;
    try {
      var saved = validLang(localStorage.getItem("supernova-lang"));
      if (saved) return saved;
    } catch (_) {
      /* noop */
    }
    return (navigator.language || "en").toLowerCase().startsWith("ja") ? "ja" : "en";
  }

  function applyLang() {
    document.documentElement.lang = bridgeLang;
    document.title = text.title;
    titleEl.textContent = text.title;
    statusEl.textContent = text.preparing;
    retryEl.textContent = text.retry;
    noteEl.textContent = text.note;
  }

  function setStatus(text, isError) {
    statusEl.textContent = text;
    statusEl.className = isError ? "error" : "";
  }

  function collectKeys() {
    var keys = {};
    for (var i = 0; i < ALLOWED_KEYS.length; i++) {
      var key = ALLOWED_KEYS[i];
      var value = localStorage.getItem(key);
      if (value === null) continue;
      if (typeof value !== "string" || value.length > MAX_CHARS) {
        return { error: "payload_too_large", keys: {} };
      }
      keys[key] = value;
    }
    return { keys: keys };
  }

  function postSavedData() {
    if (finished) return;
    retryEl.dataset.mode = "retry";
    retryEl.textContent = text.retry;
    if (!window.opener || window.opener.closed) {
      setStatus(text.openFromNewSite, true);
      return;
    }

    var collected = collectKeys();
    var payload = {
      kind: KIND,
      schemaVersion: SCHEMA_VERSION,
      sourceOrigin: window.location.origin,
      targetOrigin: targetOrigin,
      createdAt: new Date().toISOString(),
      keys: collected.keys
    };
    if (collected.error) payload.error = collected.error;

    var size = JSON.stringify(payload).length;
    if (size > MAX_CHARS) {
      payload = {
        kind: KIND,
        schemaVersion: SCHEMA_VERSION,
        sourceOrigin: window.location.origin,
        targetOrigin: targetOrigin,
        createdAt: new Date().toISOString(),
        error: "payload_too_large",
        keys: {}
      };
    }

    window.opener.postMessage(payload, targetOrigin);
    attempts += 1;
    setStatus(Object.keys(payload.keys).length ? text.sending : text.noData);
    if (attempts < 6) setTimeout(postSavedData, 650);
  }

  window.addEventListener("message", function (event) {
    if (event.origin !== targetOrigin) return;
    var data = event.data || {};
    if (data.kind !== ACK_KIND || data.schemaVersion !== SCHEMA_VERSION) return;
    finished = true;
    if (data.status === "ok") {
      setStatus(text.done);
      retryEl.dataset.mode = "close";
      retryEl.textContent = text.close;
    } else {
      setStatus(text.failed, true);
    }
  });

  retryEl.addEventListener("click", function () {
    if (retryEl.dataset.mode === "close") {
      try {
        window.close();
      } catch (_) {
        /* noop */
      }
      return;
    }
    finished = false;
    attempts = 0;
    postSavedData();
  });

  postSavedData();
})();
</script>
</body>
</html>
